<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Screen Recorder Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2196f3;
            --secondary-color: #f50057;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --dark-color: #333;
            --light-color: #f5f5f5;
            --white-color: #fff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--white-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, var(--primary-color), #64b5f6);
            color: var(--white-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            opacity: 0.9;
            font-size: 1rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            margin-bottom: 1.5rem;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 1rem;
            text-decoration: none;
            flex: 1;
            min-width: 120px;
        }

        .btn i {
            margin-right: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white-color);
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: var(--white-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: var(--white-color);
        }

        .btn-success {
            background-color: var(--success-color);
            color: var(--white-color);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .recording-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;
        }

        .recording-dot {
            width: 12px;
            height: 12px;
            background-color: var(--danger-color);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer {
            font-family: monospace;
            font-size: 16px;
            margin-left: 10px;
        }

        .audio-options {
            margin-bottom: 1.5rem;
        }

        .radio-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input {
            margin-right: 0.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .navbar {
            background-color: var(--dark-color);
            color: var(--white-color);
            padding: 1rem 0;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .logo i {
            margin-right: 0.5rem;
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 1.5rem;
        }

        .nav-links a {
            color: var(--white-color);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .nav-links a.active {
            color: var(--primary-color);
        }

        .footer {
            background-color: var(--dark-color);
            color: var(--white-color);
            padding: 2rem 0;
            margin-top: 3rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            list-style: none;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .footer-links li {
            margin: 0 1rem;
        }

        .footer-links a {
            color: var(--white-color);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .footer-links a:hover {
            opacity: 0.8;
        }

        .copyright {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <i class="fas fa-video"></i>
                <span>Web Screen Recorder</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="demo.html" class="active">Basic Demo</a></li>
                <li><a href="advanced-demo.html">Advanced Demo</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Web Screen Recorder</h2>
                <p class="card-subtitle">Record your screen directly from your browser</p>
            </div>
            <div class="card-body">
                <div class="form-group audio-options">
                    <label class="form-label">Audio Source</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="audio-source" value="mic" checked> Microphone
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="audio-source" value="none"> No Audio
                        </label>
                    </div>
                </div>

                <div class="video-container">
                    <video id="preview" autoplay muted></video>
                    <div class="recording-indicator" id="recordingIndicator">
                        <div class="recording-dot"></div>
                        <span>Recording</span>
                        <span class="timer" id="timer">00:00:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button id="startBtn" class="btn btn-primary">
                        <i class="fas fa-play"></i> Start Recording
                    </button>
                    <button id="pauseBtn" class="btn btn-warning" disabled>
                        <i class="fas fa-pause"></i> Pause
                    </button>
                    <button id="stopBtn" class="btn btn-danger" disabled>
                        <i class="fas fa-stop"></i> Stop Recording
                    </button>
                    <button id="downloadBtn" class="btn btn-success" disabled>
                        <i class="fas fa-download"></i> Download
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <ul class="footer-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="PROJECT_DOCUMENTATION.md">Documentation</a></li>
                <li><a href="USER_GUIDE.md">User Guide</a></li>
                <li><a href="PRESENTATION.md">Presentation</a></li>
            </ul>
            <p class="copyright">&copy; 2025 Web Screen Recorder - Final Year Project</p>
        </div>
    </footer>

    <script>
        // Elements
        const videoElement = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const timerElement = document.getElementById('timer');

        // Variables
        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let isRecording = false;
        let isPaused = false;
        let startTime;
        let elapsedTime = 0;
        let timerInterval;

        // Event listeners
        startBtn.addEventListener('click', startRecording);
        pauseBtn.addEventListener('click', togglePause);
        stopBtn.addEventListener('click', stopRecording);
        downloadBtn.addEventListener('click', downloadRecording);

        // Functions
        async function startRecording() {
            try {
                // Reset recorded chunks
                recordedChunks = [];

                // Get audio preference
                const audioSource = document.querySelector('input[name="audio-source"]:checked').value;
                const withAudio = audioSource === 'mic';

                // Get screen stream
                const displayMediaOptions = {
                    video: {
                        cursor: "always"
                    },
                    audio: false
                };

                stream = await navigator.mediaDevices.getDisplayMedia(displayMediaOptions);

                // Add audio if requested
                if (withAudio) {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const audioTrack = audioStream.getAudioTracks()[0];
                    stream.addTrack(audioTrack);
                }

                // Display the stream in the video element
                videoElement.srcObject = stream;

                // Create media recorder
                mediaRecorder = new MediaRecorder(stream);

                // Set up event handlers
                mediaRecorder.ondataavailable = handleDataAvailable;
                mediaRecorder.onstop = handleStop;

                // Start recording
                mediaRecorder.start(1000); // Collect data every second
                isRecording = true;
                isPaused = false;

                // Update UI
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                downloadBtn.disabled = true;
                recordingIndicator.style.display = 'flex';

                // Start timer
                startTimer();

                // Listen for stream end (user clicks "Stop sharing")
                stream.getVideoTracks()[0].onended = () => {
                    stopRecording();
                };
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Could not start recording: ' + error.message);
            }
        }

        function togglePause() {
            if (!mediaRecorder) return;

            if (isPaused) {
                // Resume recording
                mediaRecorder.resume();
                isPaused = false;
                pauseBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
                pauseBtn.classList.remove('btn-primary');
                pauseBtn.classList.add('btn-warning');

                // Resume timer
                startTimer();
            } else {
                // Pause recording
                mediaRecorder.pause();
                isPaused = true;
                pauseBtn.innerHTML = '<i class="fas fa-play"></i> Resume';
                pauseBtn.classList.remove('btn-warning');
                pauseBtn.classList.add('btn-primary');

                // Pause timer
                clearInterval(timerInterval);
            }
        }

        function stopRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            // Stop recording
            mediaRecorder.stop();
            isRecording = false;
            isPaused = false;

            // Stop all tracks
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            // Update UI
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            downloadBtn.disabled = false;
            recordingIndicator.style.display = 'none';

            // Stop timer
            clearInterval(timerInterval);
        }

        function handleDataAvailable(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        }

        function handleStop() {
            // Create recording blob
            const blob = new Blob(recordedChunks, {
                type: 'video/webm'
            });

            // Create URL for the blob
            const url = URL.createObjectURL(blob);

            // Display the recorded video
            videoElement.srcObject = null;
            videoElement.src = url;
            videoElement.controls = true;
        }

        function downloadRecording() {
            if (recordedChunks.length === 0) return;

            const blob = new Blob(recordedChunks, {
                type: 'video/webm'
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `screen-recording-${new Date().toISOString()}.webm`;

            document.body.appendChild(a);
            a.click();

            // Clean up
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        function startTimer() {
            // Clear any existing timer
            clearInterval(timerInterval);

            // Set start time if not resuming
            if (!isPaused) {
                startTime = Date.now() - elapsedTime;
            } else {
                startTime = Date.now() - elapsedTime;
            }

            // Update timer display every 1000ms (1 second)
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateTimerDisplay();
            }, 1000);

            // Initial display update
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            timerElement.textContent = [
                hours.toString().padStart(2, '0'),
                minutes.toString().padStart(2, '0'),
                seconds.toString().padStart(2, '0')
            ].join(':');
        }
    </script>
</body>
</html>
